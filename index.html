<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Blocolab</title>
  </head>
  <body>
    <aside class="toolbar">
      <fieldset>
        <legend class="visually-hidden">Peça</legend>
        <label title="Pilha">
          <input type="radio" name="tool" value="battery" checked />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="2" y="7" width="17" height="10" rx="2" fill="var(--battery)" />
            <path d="M11 7h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6z" fill="var(--copper)" />
            <rect x="19" y="10" width="3.2" height="4" rx="1" fill="var(--socket)" />
            <path d="M13.5 12h4M15.5 10v4M4.5 12h4" stroke="var(--control)" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span class="visually-hidden">Pilha</span>
        </label>
        <label title="Fio">
          <input type="radio" name="tool" value="wire" />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" stroke="var(--wire)" stroke-width="4" stroke-linecap="round" />
            <circle cx="4" cy="12" r="2.4" fill="var(--gold)" />
            <circle cx="20" cy="12" r="2.4" fill="var(--gold)" />
          </svg>
          <span class="visually-hidden">Fio</span>
        </label>
        <label title="Interruptor">
          <input type="radio" name="tool" value="switch" />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="5" cy="17" r="2.4" fill="var(--gold)" />
            <circle cx="19" cy="17" r="2.4" fill="var(--gold)" />
            <path d="M5 17 17 7" stroke="var(--switch)" stroke-width="3.2" stroke-linecap="round" />
          </svg>
          <span class="visually-hidden">Interruptor</span>
        </label>
        <label title="Lâmpada">
          <input type="radio" name="tool" value="lamp" />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="10" r="7" fill="var(--bulb)" />
            <rect x="8.5" y="16.5" width="7" height="4.5" rx="1.2" fill="var(--socket)" />
          </svg>
          <span class="visually-hidden">Lâmpada</span>
        </label>
        <label title="Motor">
          <input type="radio" name="tool" value="motor" />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="var(--motor)" />
            <path d="M12 4v16M4 12h16" stroke="white" stroke-width="2.6" stroke-linecap="round" transform="rotate(30 12 12)" />
          </svg>
          <span class="visually-hidden">Motor</span>
        </label>
        <label title="Campainha">
          <input type="radio" name="tool" value="buzzer" />
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="8" cy="12" r="5.5" fill="var(--buzzer)" />
            <path d="M15.5 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14" stroke="var(--buzzer)" fill="none" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span class="visually-hidden">Campainha</span>
        </label>
        <label title="Borracha">
          <input type="radio" name="tool" value="eraser" />
          <span aria-hidden="true">🧽</span>
          <span class="visually-hidden">Borracha</span>
        </label>
      </fieldset>
      <button type="button" class="undo" aria-label="Desfazer" title="Desfazer" disabled>↶</button>
      <output class="visually-hidden" aria-live="polite">0 peças</output>
    </aside>
    <main>
      <section class="challenge" aria-label="Desafio" aria-live="polite">
        <p class="goal"></p>
        <button type="button" class="next" hidden>Próximo desafio</button>
        <p class="hint"></p>
      </section>
      <!-- biome-ignore lint/a11y/noInteractiveElementToNoninteractiveRole: the board is a keyboard-driven widget, which is what the application role announces -->
      <canvas id="world" role="application" tabindex="0" aria-label="Tabuleiro"></canvas>
      <div class="piece-name" role="tooltip" hidden></div>
      <p class="no-3d" role="alert" hidden>
        Este browser não consegue mostrar o tabuleiro em 3D. Experimenta numa versão recente do Chrome, Firefox, Safari ou Edge.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
