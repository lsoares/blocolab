<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Blocolab</title>
  </head>
  <body>
    <nav class="toolbar" aria-label="Ferramentas">
      <button data-tool="brush" aria-pressed="true" aria-label="Pincel" title="Pincel">🖌️</button>
      <button data-tool="eraser" aria-pressed="false" aria-label="Borracha" title="Borracha">🧽</button>
      <hr />
      <button data-camera="rotate-left" aria-label="Rodar para a esquerda" title="Rodar para a esquerda">↺</button>
      <button data-camera="rotate-right" aria-label="Rodar para a direita" title="Rodar para a direita">↻</button>
      <button data-camera="zoom-in" aria-label="Aproximar" title="Aproximar">➕</button>
      <button data-camera="zoom-out" aria-label="Afastar" title="Afastar">➖</button>
    </nav>
    <canvas id="world" aria-label="Mundo"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
