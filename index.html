<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Blocolab</title>
  </head>
  <body>
    <aside class="toolbar">
      <fieldset>
        <legend class="visually-hidden">Ferramenta</legend>
        <label title="Cubo baixo">
          <input type="radio" name="tool" value="cube" data-height="1" checked />
          <svg aria-hidden="true" viewBox="-0.97 -0.77 1.93 1.93"><polygon points="0.87,0.50 0.87,-0.10 0.00,0.40 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,0.40 -0.87,-0.10" fill="var(--block-shade)" /><polygon points="0.00,-0.60 0.87,-0.10 0.00,0.40 -0.87,-0.10" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Cubo baixo</span>
        </label>
        <label title="Cubo médio">
          <input type="radio" name="tool" value="cube" data-height="2" />
          <svg aria-hidden="true" viewBox="-1.20 -1.30 2.40 2.40"><polygon points="0.87,0.50 0.87,-0.70 0.00,-0.20 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,-0.20 -0.87,-0.70" fill="var(--block-shade)" /><polygon points="0.00,-1.20 0.87,-0.70 0.00,-0.20 -0.87,-0.70" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Cubo médio</span>
        </label>
        <label title="Cubo alto">
          <input type="radio" name="tool" value="cube" data-height="3" />
          <svg aria-hidden="true" viewBox="-1.50 -1.90 3.00 3.00"><polygon points="0.87,0.50 0.87,-1.30 0.00,-0.80 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,-0.80 -0.87,-1.30" fill="var(--block-shade)" /><polygon points="0.00,-1.80 0.87,-1.30 0.00,-0.80 -0.87,-1.30" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Cubo alto</span>
        </label>
        <label title="Rampa baixa">
          <input type="radio" name="tool" value="ramp" data-height="1" />
          <svg aria-hidden="true" viewBox="-0.97 -0.52 1.93 1.93"><polygon points="0.87,0.50 0.87,-0.10 0.00,0.40 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,0.40" fill="var(--block-shade)" /><polygon points="0.00,0.00 0.87,-0.10 0.00,0.40 -0.87,0.50" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Rampa baixa</span>
        </label>
        <label title="Rampa média">
          <input type="radio" name="tool" value="ramp" data-height="2" />
          <svg aria-hidden="true" viewBox="-0.97 -0.82 1.93 1.93"><polygon points="0.87,0.50 0.87,-0.70 0.00,-0.20 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,-0.20" fill="var(--block-shade)" /><polygon points="0.00,0.00 0.87,-0.70 0.00,-0.20 -0.87,0.50" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Rampa média</span>
        </label>
        <label title="Rampa alta">
          <input type="radio" name="tool" value="ramp" data-height="3" />
          <svg aria-hidden="true" viewBox="-1.25 -1.40 2.50 2.50"><polygon points="0.87,0.50 0.87,-1.30 0.00,-0.80 0.00,1.00" fill="var(--block-side)" /><polygon points="-0.87,0.50 0.00,1.00 0.00,-0.80" fill="var(--block-shade)" /><polygon points="0.00,0.00 0.87,-1.30 0.00,-0.80 -0.87,0.50" fill="var(--block-top)" /></svg>
          <span class="visually-hidden">Rampa alta</span>
        </label>
        <label title="Bola">
          <input type="radio" name="tool" value="ball" />
          <svg aria-hidden="true" viewBox="-1 -1 2 2"><circle r="0.7" fill="var(--ball)" /></svg>
          <span class="visually-hidden">Bola</span>
        </label>
        <label title="Borracha">
          <input type="radio" name="tool" value="eraser" />
          <span aria-hidden="true">🧽</span>
          <span class="visually-hidden">Borracha</span>
        </label>
      </fieldset>
      <button type="button" class="undo" aria-label="Desfazer" title="Desfazer" disabled>↶</button>
      <output class="visually-hidden" aria-live="polite">0 blocos</output>
    </aside>
    <main>
      <!-- biome-ignore lint/a11y/noInteractiveElementToNoninteractiveRole: the world is a keyboard-driven widget, which is what the application role announces -->
      <canvas id="world" role="application" tabindex="0" aria-label="Mundo"></canvas>
      <button type="button" class="run" aria-label="Correr" title="Correr / Parar">▶</button>
      <fieldset class="camera">
        <legend class="visually-hidden">Câmara</legend>
        <button type="button" data-camera="rotate" aria-label="Rodar" title="Rodar">⟳</button>
        <button type="button" data-camera="zoom-in" aria-label="Aproximar" title="Aproximar">+</button>
        <button type="button" data-camera="zoom-out" aria-label="Afastar" title="Afastar">−</button>
      </fieldset>
      <p class="no-3d" role="alert" hidden>
        Este browser não consegue mostrar o mundo em 3D. Experimenta numa versão recente do Chrome, Firefox, Safari ou Edge.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
